name: Daily trending update

on:
  schedule:
    # Every 6 hours: 00, 06, 12, 18 UTC = 09, 15, 21, 03 KST.
    # The script snapshots daily/weekly/monthly for the current KST
    # date, and the commit step below only commits when data changed,
    # so a period's list is re-recorded whenever it changes.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch trending
        run: python scripts/fetch_trending.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update trending for $(date -u +%Y-%m-%d)"
          git push
