name: Daily trending update

on:
  schedule:
    # Every 6 hours: 00, 06, 12, 18 UTC = 09, 15, 21, 03 KST.
    # The script snapshots daily/weekly/monthly for the current KST
    # date, and the commit step below only commits when data changed,
    # so a period's list is re-recorded whenever it changes.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch trending
        run: python scripts/fetch_trending.py
      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update trending for $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push
      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so the Pages deploy workflow never fires after a scheduled
      # update. Dispatch it explicitly when data actually changed.
      # (workflow_dispatch events are exempt from that suppression.)
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
